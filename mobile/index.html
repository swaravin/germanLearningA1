<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="German Learn" />
    <meta name="theme-color" content="#1a4d7a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <title>German Learn</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="shell">
      <header>
        <h1 id="app-title">🇩🇪 German Learn</h1>
        <p id="app-subtitle">Flashcards · works offline after first open</p>
      </header>

      <div id="install-hint" class="install-hint"></div>

      <div id="flash-view">
        <div class="toolbar toolbar-level">
          <label class="level-picker-label" for="cefr-level">Word list level</label>
          <select id="cefr-level" aria-label="CEFR level"></select>
        </div>
        <div class="toolbar">
          <select id="section-filter" aria-label="Section"></select>
          <select id="front-mode" aria-label="Front side">
            <option value="german">German front</option>
            <option value="english">English front</option>
            <option value="both">German + English</option>
          </select>
        </div>

        <div class="progress-wrap">
          <div class="progress-bar" aria-hidden="true">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="progress-label" id="progress">Loading…</div>
        </div>

        <div class="card-panel">
          <div class="card-wrap">
            <div class="card" id="flashcard">
              <div class="card-face card-front" id="card-front"></div>
              <div class="card-face card-back" id="card-back"></div>
            </div>
            <p class="card-hint">Tap card to flip</p>
          </div>

          <div id="card-sentence"></div>
        </div>

        <div class="actions actions-nav">
          <button type="button" id="btn-prev" class="nav-btn">← Prev</button>
          <button type="button" id="btn-next" class="nav-btn">Next →</button>
        </div>
        <div class="actions actions-tools" style="margin-top: 10px">
          <button type="button" id="btn-speak-de" class="speak-de">🔊 DE</button>
          <button type="button" id="btn-speak-en" class="speak-en">🔊 EN</button>
          <button type="button" id="btn-shuffle" class="shuffle-btn">Shuffle</button>
        </div>
      </div>

      <div id="browse-view" class="hidden">
        <input id="search" type="search" placeholder="Search German or English…" autocomplete="off" />
        <ul class="word-list" id="word-list"></ul>
      </div>
    </div>

    <nav class="tabs">
      <button type="button" id="tab-flash" class="active">Flashcards</button>
      <button type="button" id="tab-browse">Word list</button>
    </nav>
  </body>
  <script src="js/app.js" defer></script>
</html>
