<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DE A1" />
    <meta name="theme-color" content="#1f4e79" />
    <title>German A1</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header>
      <h1>🇩🇪 German A1</h1>
      <p>Flashcards · works offline after first open</p>
    </header>

    <div id="install-hint" class="install-hint"></div>

    <div id="flash-view">
      <div class="toolbar">
        <select id="section-filter" aria-label="Section"></select>
        <select id="front-mode" aria-label="Front side">
          <option value="german">German front</option>
          <option value="english">English front</option>
          <option value="both">German + English</option>
        </select>
      </div>

      <div class="progress" id="progress">Loading…</div>

      <div class="card-wrap">
        <div class="card" id="flashcard">
          <div class="card-face card-front" id="card-front"></div>
          <div class="card-face card-back" id="card-back"></div>
        </div>
      </div>

      <div id="card-sentence"></div>

      <div class="actions">
        <button type="button" id="btn-prev">← Prev</button>
        <button type="button" id="btn-speak-de" class="speak">🔊 DE</button>
        <button type="button" id="btn-next">Next →</button>
      </div>
      <div class="actions" style="margin-top: 8px; grid-template-columns: 1fr 1fr">
        <button type="button" id="btn-speak-en" class="speak">🔊 EN</button>
        <button type="button" id="btn-shuffle">Shuffle</button>
      </div>
    </div>

    <div id="browse-view" class="hidden">
      <input id="search" type="search" placeholder="Search German or English…" autocomplete="off" />
      <ul class="word-list" id="word-list"></ul>
    </div>

    <nav class="tabs">
      <button type="button" id="tab-flash" class="active">Flashcards</button>
      <button type="button" id="tab-browse">Word list</button>
    </nav>
  </body>
  <script src="js/app.js" defer></script>
</html>
